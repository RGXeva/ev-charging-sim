<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 92" width="600" height="92" font-family="Avenir Next, PingFang SC, sans-serif"><rect x="0.5" y="0.5" width="599" height="91" rx="10" fill="#f7f9fb" stroke="#d7dee6"/><text x="16" y="24" font-size="11" font-weight="600" fill="#1c2430">Inside one station = 1 MPI process + 7 OpenMP threads</text><rect x="16" y="38" width="128" height="38" rx="7" fill="#1c2430"/><text x="80" y="55" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="600">Thread 0: controller</text><text x="80" y="69" font-size="9" fill="#b9c6d3" text-anchor="middle">only thread calling MPI</text><rect x="172" y="38" width="50" height="38" rx="7" fill="#1f5d8c" stroke="#1f5d8c"/><text x="197" y="54" font-size="10" fill="#fff" text-anchor="middle">Port 1</text><text x="197" y="68" font-size="9" fill="#dbe9f6" text-anchor="middle">busy</text><rect x="228" y="38" width="50" height="38" rx="7" fill="#ffffff" stroke="#d7dee6"/><text x="253" y="54" font-size="10" fill="#2f3946" text-anchor="middle">Port 2</text><text x="253" y="68" font-size="9" fill="#6b7684" text-anchor="middle">free</text><rect x="284" y="38" width="50" height="38" rx="7" fill="#1f5d8c" stroke="#1f5d8c"/><text x="309" y="54" font-size="10" fill="#fff" text-anchor="middle">Port 3</text><text x="309" y="68" font-size="9" fill="#dbe9f6" text-anchor="middle">busy</text><rect x="340" y="38" width="50" height="38" rx="7" fill="#1f5d8c" stroke="#1f5d8c"/><text x="365" y="54" font-size="10" fill="#fff" text-anchor="middle">Port 4</text><text x="365" y="68" font-size="9" fill="#dbe9f6" text-anchor="middle">busy</text><rect x="396" y="38" width="50" height="38" rx="7" fill="#ffffff" stroke="#d7dee6"/><text x="421" y="54" font-size="10" fill="#2f3946" text-anchor="middle">Port 5</text><text x="421" y="68" font-size="9" fill="#6b7684" text-anchor="middle">free</text><rect x="452" y="38" width="50" height="38" rx="7" fill="#1f5d8c" stroke="#1f5d8c"/><text x="477" y="54" font-size="10" fill="#fff" text-anchor="middle">Port 6</text><text x="477" y="68" font-size="9" fill="#dbe9f6" text-anchor="middle">busy</text><text x="514" y="55" font-size="9.5" fill="#6b7684">Own slot each,</text><text x="514" y="69" font-size="9.5" fill="#6b7684">no locks</text></svg>